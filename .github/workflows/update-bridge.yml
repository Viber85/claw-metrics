name: Publish legacy updater bridge to 0.3.0-rc.2
on:
  push:
    branches: [test/update-bridge-122]

permissions:
  contents: write

concurrency:
  group: claw-metrics-test-122-update-bridge
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      DEST_TAG: v0.2.4-test.122
      SOURCE_TAG: v0.3.0-rc.2
      SOURCE_COMMIT: 8cefea79f8ba1468fea5ca30d8d8cd7689ed0667
      SOURCE_SHA256: cb53341808283a95a09a8955c02e5586f7ac750af9110d17c402d4c6364983df
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the exact tested ZIP and both update paths
        run: |
          gh release download "$SOURCE_TAG" --pattern "ClawMetrics-$SOURCE_TAG.zip" --output "ClawMetrics-$DEST_TAG.zip"
          printf '%s  %s\n' "$SOURCE_SHA256" "ClawMetrics-$DEST_TAG.zip" | sha256sum --check
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" > release-feed.json
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import tempfile
          import types
          import zipfile

          import updates

          source_tag, dest_tag = os.environ['SOURCE_TAG'], os.environ['DEST_TAG']
          archive = pathlib.Path(f'ClawMetrics-{dest_tag}.zip')
          with zipfile.ZipFile(archive) as package:
              assert package.testzip() is None
              for name in ['main.py', 'dist/index.js', 'native64/libMangoHud.so',
                           'py_modules/framegen_setup.py', 'py_modules/updates.py']:
                  assert package.getinfo('ClawMetrics/' + name).file_size > 0
              manifest = json.loads(package.read('ClawMetrics/package.json'))
          assert manifest['version'] == source_tag.removeprefix('v')

          feed = json.loads(pathlib.Path('release-feed.json').read_text())
          legacy = types.ModuleType('legacy_updater')
          exec(subprocess.check_output(['git', 'show', '231ab87:updates.py'], text=True), legacy.__dict__)
          asset = {
              'name': archive.name,
              'size': archive.stat().st_size,
              'digest': 'sha256:' + hashlib.sha256(archive.read_bytes()).hexdigest(),
              'browser_download_url': f'https://github.com/{updates.REPOSITORY}/releases/download/{dest_tag}/{archive.name}',
          }
          feed.insert(0, {'tag_name': dest_tag, 'assets': [asset]})
          with tempfile.TemporaryDirectory() as directory:
              package_file = pathlib.Path(directory) / 'package.json'
              for updater, installed, tag, available in [
                  (legacy, '0.2.4-test.121', dest_tag, True),
                  (updates, '0.3.0-rc.1', source_tag, True),
                  (updates, manifest['version'], source_tag, False),
              ]:
                  package_file.write_text(json.dumps({'version': installed}))
                  result = updater.validate_github_feed(package_file, json.dumps(feed))
                  assert result['available'] == available and result['latest']['tag'] == tag, result
          PY
      - name: Publish the compatibility entry
        run: |
          gh release create "$DEST_TAG" "ClawMetrics-$DEST_TAG.zip" \
            --target "$SOURCE_COMMIT" --prerelease \
            --title "Claw Metrics $SOURCE_TAG — update from older test builds" \
            --notes "This is the verified $SOURCE_TAG ZIP under a filename recognized by older Claw Metrics updaters. After installation, the plugin reports $SOURCE_TAG and detects newer release candidates directly."
