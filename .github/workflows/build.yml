name: Build and release Decky plugin
on:
  push:
    branches: [main, renderer-native]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, i386]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: native-dist
          key: claw-native-v081-${{ matrix.arch }}-${{ hashFiles('renderer/claw-metrics.patch', 'renderer/claw_layout.h', 'tools/build_renderer.sh') }}
      - name: Install runtime verification tools
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools xvfb libxkbcommon0 libgl1 gdb
      - name: Install native compiler and headers
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y g++ g++-multilib ninja-build python3-mako python3-pip glslang-tools pkg-config nlohmann-json3-dev libx11-dev libxkbcommon-dev libgl1-mesa-dev
          if [ "${{ matrix.arch }}" = i386 ]; then
            sudo apt-get install -y libx11-dev:i386 libxkbcommon-dev:i386 libgl1-mesa-dev:i386
          fi
          python3 -m pip install meson==1.3.2
      - name: Build isolated renderer
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash tools/build_renderer.sh "${{ matrix.arch }}"
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: native-dist
          key: claw-native-v081-${{ matrix.arch }}-${{ hashFiles('renderer/claw-metrics.patch', 'renderer/claw_layout.h', 'tools/build_renderer.sh') }}
      - name: Test actual Vulkan rendering
        if: matrix.arch == 'x86_64'
        run: python3 tools/test_native_vulkan.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch }}
          path: native-dist/
  build:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read version
        id: version
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "number=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build Decky QAM frontend
        run: npm run build
      - name: Reject CommonJS requires in browser bundle
        run: |
          test -s dist/index.js
          node -e 'const s=require("node:fs").readFileSync("dist/index.js","utf8");if(/\brequire\s*\(/.test(s)) { throw new Error("Decky bundle contains unsupported CommonJS require()") }'
      - name: Check Python backend
        run: |
          python3 -m py_compile main.py
          python3 -m unittest discover -s tests
      - name: Check native ImGui layout and bundled font
        run: python3 tools/check_native_layout.py
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-packages
      - name: Prepare native bundle
        run: python3 tools/package_renderer.py
      - name: Install graphics integration test dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools mesa-utils xvfb libxkbcommon0 libgl1 libx11-dev libgl1-mesa-dev gcc-multilib libx11-dev:i386 libgl1-mesa-dev:i386 libgl1-mesa-dri:i386 libxkbcommon0:i386 gdb
      - name: Test packaged private launcher with Vulkan and OpenGL
        run: python3 tools/test_private_launch.py
      - name: Package plugin ZIP
        run: |
          mkdir -p artifact/ClawMetrics
          cp plugin.json package.json main.py sensors.py README.md artifact/ClawMetrics/
          cp -r dist assets py_modules artifact/ClawMetrics/
          (cd artifact && zip -r "../ClawMetrics-v${{ steps.version.outputs.number }}.zip" ClawMetrics)
      - name: Validate installation ZIP
        run: |
          python3 - <<'PYZIP'
          import json, zipfile, pathlib
          version = json.loads(pathlib.Path('package.json').read_text())['version']
          with zipfile.ZipFile(f'ClawMetrics-v{version}.zip') as package:
              assert package.testzip() is None
              for name in ('main.py', 'plugin.json', 'package.json', 'dist/index.js', 'assets/ClawSans.ttf.gz.b64', 'assets/FONT-LICENSE.txt', 'assets/native/index.json', 'py_modules/claw_renderer.py'):
                  assert f'ClawMetrics/{name}' in package.namelist(), name
              assert json.loads(package.read('ClawMetrics/package.json'))['version'] == version
              assert f'v{version}' in package.read('ClawMetrics/dist/index.js').decode()
          PYZIP
      - uses: actions/upload-artifact@v4
        with:
          name: ClawMetrics-v${{ steps.version.outputs.number }}
          path: ClawMetrics-v${{ steps.version.outputs.number }}.zip
      - name: Publish experimental GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          PACKAGE="ClawMetrics-v${VERSION}.zip"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$PACKAGE" --clobber
          else
            gh release create "v${VERSION}" "$PACKAGE" --target "$GITHUB_SHA" \
              --title "Claw Metrics v${VERSION} (experimental)" \
              --notes "Claw Metrics v0.3.0: isolated native renderer for 64/32-bit games, independent FPS number size, four-side padding, measured centering and automatic fit. Includes a separate launch command and stock fallback. Renderer checks include actual software Vulkan/OpenGL rendering; MSI Claw hardware verification remains required." \
              --prerelease
          fi
