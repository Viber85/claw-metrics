name: Experimental modular layout
on:
  push:
    branches: [feature/modular-layout-v1]
  pull_request:
    paths:
      - 'experiments/modular/**'
      - 'experiments/native/claw_modular*.h'
      - 'tests/test_modular_schema.py'
      - 'tests/native_modular_layout.cpp'
      - 'tools/check_modular*.py'
      - 'tools/modular_imgui_probe.cpp'
      - 'tools/modular_transport_probe.cpp'
      - '.github/workflows/modular-layout.yml'
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python tools/check_modular_layout.py
      - run: python tools/check_modular_transport.py
      - run: pip install numpy pillow
      - run: python tools/check_modular_imgui.py --render-dir modular-fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: modular-imgui-fixtures
          path: modular-fixtures/
