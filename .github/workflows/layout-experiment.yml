name: Build Claw Metrics v0.2.4 test.108 ZIP
on:
  push:
    branches: [test/preview-padding-parity-108]
  workflow_dispatch:

permissions:
  contents: write

# Multiple rapid pushes must not race to overwrite the same test Release.
concurrency:
  group: claw-metrics-v0.2.4-test.108
  cancel-in-progress: true

jobs:
  layout-experiment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bundle four licensed Barlow font weights in build artifact
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import urllib.request

          revision = "89f5431ff0db41bd2fe3f7ba21a723a01622428b"
          prefix = "https://raw.githubusercontent.com/google/fonts/" + revision + "/ofl/barlowsemicondensed/"
          expected = {
              "Light": "f7e0277904b0d7e560d5b178e0ad680d9a096cfd",
              "Regular": "473604976bc07e69c0a8e6dca63e159fac54f5fe",
              "SemiBold": "082c76327d21d663948c8ccd2271fa527bd0c145",
              "Bold": "ee04b09e31e98d2509354d7003797ec6540e796f",
          }
          target = pathlib.Path("assets/fonts")
          target.mkdir(parents=True, exist_ok=True)
          for weight, digest in expected.items():
              name = f"BarlowSemiCondensed-{weight}.ttf"
              with urllib.request.urlopen(prefix + name, timeout=30) as r:
                  data = r.read(220000)
              actual = hashlib.sha1(b"blob " + str(len(data)).encode() + bytes([0]) + data).hexdigest()
              assert actual == digest, f"Unexpected contents for {name}"
              (target / name).write_bytes(data)
              print("Verified", name, len(data), "bytes")
          with urllib.request.urlopen(prefix + "OFL.txt", timeout=30) as r:
              license_text = r.read(20000)
          assert b"SIL OPEN FONT LICENSE" in license_text.upper()
          (target / "OFL.txt").write_bytes(license_text)
          print("Four font weights and OFL license bundled successfully")
          PY
      - name: Python tests
        env:
          CLAW_METRICS_SKIP_FONT_DOWNLOAD: "1"
        run: python3 -m unittest discover -s tests
      - name: Install Decky dependencies
        run: npm install --no-audit --no-fund
      - name: Test frontend style persistence and responsive slider contract
        run: |
          node tests/style_presets.test.mjs
          node tests/slider_field.test.mjs
          node tests/session_reports.test.mjs
          node tests/editor_page.test.mjs
          node tests/ui_boundary.test.mjs
          node tests/modular_editor.test.mjs
          node tests/modular_builder.test.mjs
          node tests/modular_preview.test.mjs
          node tests/classic_layout.test.mjs
      - name: Verify isolated Decky backend import
        run: python3 -m unittest discover -s tests -p test_decky_backend_import.py
      - name: Type-check QAM
        run: npm run typecheck
      - name: Build QAM
        run: npm run build
      - name: Check original ImGui geometry
        run: python3 tools/check_native_layout.py
      - name: Compare real browser preview and production ImGui padding geometry
        run: |
          pip install numpy pillow
          python3 tools/check_preview_parity.py --font-dir assets/fonts --output preview-parity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-native-parity
          path: preview-parity/
      - name: Install native build prerequisites
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git g++ pkg-config meson ninja-build python3-mako \
            libvulkan-dev glslang-tools libgl-dev libegl-dev \
            libdrm-dev libcap-dev libgbm-dev libx11-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libdbus-1-dev libsystemd-dev \
            libpciaccess-dev libglvnd-dev mesa-vulkan-drivers vulkan-tools mesa-utils xvfb xauth gdb
      - name: Build isolated MangoHud 0.8.1 (x86_64 Vulkan and OpenGL)
        run: |
          git clone --depth 1 --recurse-submodules --branch v0.8.1 \
            https://github.com/flightlessmango/MangoHud.git native-source
          cd native-source
          cp ../experiments/native/claw_horizontal_separator.h src/
          patch --dry-run -p1 < ../experiments/mangohud-v0.8.1-spacing.patch
          patch -p1 < ../experiments/mangohud-v0.8.1-spacing.patch
          patch --dry-run -p1 < ../experiments/mangohud-v0.8.1-separator-color.patch
          patch -p1 < ../experiments/mangohud-v0.8.1-separator-color.patch
          grep -q 'IM_COL32' src/overlay.cpp
          patch --dry-run -p1 < ../experiments/mangohud-v0.8.1-condensed-font.patch
          patch -p1 < ../experiments/mangohud-v0.8.1-condensed-font.patch
          grep -q 'params.horizontal_separator_color' src/overlay.cpp
          grep -q 'claw_horizontal_separator::geometry' src/overlay.cpp
          patch --dry-run -p1 < ../experiments/mangohud-v0.8.1-compact-other-groups.patch
          patch -p1 < ../experiments/mangohud-v0.8.1-compact-other-groups.patch
          patch --dry-run -p1 < ../experiments/mangohud-v0.8.1-inline-fps.patch
          patch -p1 < ../experiments/mangohud-v0.8.1-inline-fps.patch
          patch --dry-run -p1 < ../experiments/mangohud-v0.8.1-real-bold-fps.patch
          patch -p1 < ../experiments/mangohud-v0.8.1-real-bold-fps.patch
          python3 ../experiments/enable_apu_v3_metrics.py src
          python3 ../experiments/apply_token_styles.py src
          python3 ../experiments/enable_fps_size_center.py src
          python3 ../experiments/enable_exact_edge_anchors.py src
          python3 ../experiments/enable_frametime_graph_styles.py src
          python3 ../experiments/enable_zero_vertical_padding.py src
          python3 ../experiments/center_hud_vertically.py src
          python3 ../experiments/enhance_native_frametime_graph.py src
          python3 ../experiments/enable_fixed_numeric_slots.py src
          python3 ../experiments/trim_native_ink_padding.py src
          python3 ../experiments/enable_vertical_stacked.py src
          python3 ../experiments/enable_vertical_value_wrap.py src
          python3 ../experiments/enable_vertical_category_gap.py src
          python3 ../experiments/enable_vertical_graph_modes.py src
          python3 ../experiments/enable_horizontal_graph_modes.py src
          python3 ../experiments/enable_safe_live_reload.py src
          python3 ../tools/check_live_reload.py src
          python3 ../experiments/enable_extra_metrics.py src
          python3 ../experiments/verify_graph_fill_alpha.py src
          python3 ../experiments/enable_overlay_background.py src
          python3 ../experiments/enable_background_outline.py src
          python3 ../tools/check_background.py src
          python3 ../tools/check_extra_metrics.py src
          python3 ../experiments/enable_modular_renderer.py src
          python3 ../experiments/enable_classic_overlay_options.py src
          python3 ../experiments/fix_classic_spacing_alignment.py src
          python3 ../experiments/verify_classic_superscript_baseline.py src
          python3 ../experiments/split_tdp_styles.py src
          python3 ../experiments/fix_battery_time.py src
          python3 ../experiments/guard_glx_swap_interval.py src
          grep -q 'ClawText(3' src/hud_elements.cpp
          grep -q 'claw_metric_semibold' src/font.cpp
          grep -q 'claw_weight_map' src/overlay_params.cpp
          grep -q 'claw_bold_fps_font' src/font.cpp
          grep -q 'ClawMetricGap' src/hud_elements.cpp
          grep -q 'ClawFpsFontForToken' src/hud_elements.cpp
          grep -q 'claw_center_horizontal' src/overlay.cpp
          grep -q 'params.position == LAYER_POSITION_BOTTOM_LEFT' src/overlay.cpp
          grep -q 'const float margin = 0.0f;' src/overlay.cpp
          ! grep -q 'float margin = 10.0f;' src/overlay.cpp
          grep -q 'claw_align_right' src/overlay.cpp
          grep -q 'claw_vertex_start' src/overlay.cpp
          grep -q 'claw_draw->VtxBuffer' src/overlay.cpp
          grep -q 'ClawStableText' src/hud_elements.cpp
          grep -q 'claw_fixed_slot_right' src/overlay.cpp
          grep -q 'ImGui::ItemSize(ImVec2(stable_width, textSize.y), style.FramePadding.y)' src/overlay.cpp
          ! grep -q 'ImGui::BeginGroup()' src/hud_elements.cpp
          grep -q 'claw_graph_style' src/hud_elements.cpp
          grep -q 'claw_frametime_columns' src/hud_elements.cpp
          grep -q 'const float bar_width = ImMax(2.0f, slot - 1.4f)' src/hud_elements.cpp
          grep -q 'height = ImClamp(HUDElements.params->font_size \* 1.40f' src/hud_elements.cpp
          grep -q 'get_time_stat(HUDElements.sw_stats, idx)' src/hud_elements.cpp
          grep -q 'ClawFpsVerticalCenterOffset' src/hud_elements.cpp
          grep -q 'style.CellPadding.y = 0.0f;' src/hud_elements.cpp
          grep -q 'claw_bottom_padding' src/overlay.cpp
          grep -q 'claw_ink_trim_top' src/overlay.cpp
          grep -q 'claw_ink_start = claw_ink_draw->VtxBuffer.Size' src/overlay.cpp
          grep -q 'window_size.y = ImClamp(claw_ink_bottom' src/overlay.cpp
          grep -q 'std::isfinite(raw_value)' src/hud_elements.cpp
          grep -q 'chosen->Scale = ImClamp' src/hud_elements.cpp
          grep -q 'fps_font->FontSize \* fps_font->Scale' src/hud_elements.cpp
          grep -q 'claw_fps_row_top' src/hud_elements.cpp
          grep -q 'position.x + 1.8f' src/hud_elements.cpp
          grep -q 'claw_vertical_stack' src/overlay_params.cpp
          grep -q 'ClawVerticalGraph' src/hud_elements.cpp
          grep -q 'constexpr int subdivisions=4' src/hud_elements.cpp
          grep -q 'if(style==4 || style==5)' src/hud_elements.cpp
          grep -q '##claw_frametime_smooth' src/hud_elements.cpp
          grep -q 'claw_style == 4 || claw_style == 5' src/hud_elements.cpp
          grep -q 'const ImU32 trendColor' src/hud_elements.cpp
          grep -q 'claw_vertical_values_x' src/hud_elements.cpp
          grep -q 'claw_vertical_category_gap' src/overlay_params.cpp
          grep -q 'ImGuiStyleVar_CellPadding' src/overlay.cpp
          grep -q 'ImClamp(params.claw_vertical_category_gap' src/overlay.cpp
          grep -q 'std::snprintf(displayed, sizeof(displayed), fmt, args...)' src/hud_elements.cpp
          grep -q 'ImGui::NewLine()' src/hud_elements.cpp
          grep -q 'ClawStackedFpsCenterOffset' src/hud_elements.cpp
          grep -q 'claw_vertical_graph_width' src/overlay_params.cpp
          grep -q 'claw_vertical_graph_height' src/overlay_params.cpp
          grep -q 'claw_vertical_value_gap' src/hud_elements.cpp
          grep -q 'const std::string label = has_value' src/hud_elements.cpp
          grep -q 'const int token = item.value.find("tdp.txt")' src/hud_elements.cpp
          grep -q 'Adaptive, padded graph scale' src/hud_elements.cpp
          grep -q 'ImGuiCol_TableBorderLight' src/overlay.cpp
          grep -q 'ImGuiTableFlags_BordersInnerH' src/overlay.cpp
          # WrapDB redirects can time out. Cache identical official release
          # assets through GitHub's asset API, preserving upstream wrap hashes.
          mkdir -p subprojects/packagecache
          while read -r claw_asset claw_patch claw_digest; do
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 60 \
              -H 'Accept: application/octet-stream' \
              "https://api.github.com/repos/mesonbuild/wrapdb/releases/assets/$claw_asset" \
              -o "subprojects/packagecache/$claw_patch"
            echo "$claw_digest  subprojects/packagecache/$claw_patch" | sha256sum -c -
          done <<'PATCHES'
          38086395 vulkan-headers-1.2.158-2-wrap.zip 860358cf5e73f458cd1e88f8c38116d123ab421d5ce2e4129ec38eaedd820e17
          127147440 imgui_1.89.9-1_patch.zip 9b21290c597d76bf8d4eeb3f9ffa024b11d9ea6c61e91d648ccc90b42843d584
          126997169 implot_0.16-1_patch.zip 1c6b1462066a5452fa50c1da1dd47fed841f28232972c82d778f2962936568c7
          165966666 spdlog_1.14.1-1_patch.zip ae878e732330ea1048f90d7e117c40c0cd2a6fb8ae5492c7955818ce3aaade6c
          PATCHES
          meson setup build --prefix=/usr --buildtype=release \
            -Dwith_nvml=disabled -Dwith_xnvctrl=disabled \
            -Dwith_dbus=disabled -Dwith_x11=disabled -Dwith_wayland=enabled \
            -Dmangoplot=disabled -Dmangoapp=false -Dinclude_doc=false -Dtests=disabled
          ninja -C build -j 2
          mkdir -p ../native64
          file=$(find build -type f -name 'libMangoHud.so' -size +100k | head -1)
          test -n "$file"
          cp "$file" ../native64/libMangoHud.so
          # GLX needs X11, while the existing Vulkan build must retain its
          # already-tested no-X11 configuration to avoid a shutdown crash.
          meson setup build-gl --prefix=/usr --buildtype=debugoptimized \
            -Dwith_nvml=disabled -Dwith_xnvctrl=disabled \
            -Dwith_dbus=disabled -Dwith_x11=enabled -Dwith_wayland=enabled \
            -Dmangoplot=disabled -Dmangoapp=false -Dinclude_doc=false -Dtests=disabled
          ninja -C build-gl -j 2 src/libMangoHud_opengl.so src/libMangoHud_shim.so
          for name in libMangoHud_opengl.so libMangoHud_shim.so; do
            file=$(find build-gl -type f -name "$name" -size +10k | head -1)
            test -n "$file"
            cp "$file" "../native64/$name"
            readelf -h "../native64/$name" | grep -q 'Machine:.*X86-64'
          done
          file ../native64/libMangoHud.so
          readelf -h ../native64/libMangoHud.so | grep -q 'Machine:.*X86-64'
          test -s ../native64/libMangoHud.so
      - name: Exercise OpenGL shim and modified renderer through GLX
        run: xvfb-run -a python3 tools/test_opengl_injection.py
      - name: Exercise new metrics and live style changes through Vulkan
        run: python3 tools/test_extra_metrics_vulkan.py
      - name: Check modular geometry and document transport
        run: |
          python3 tools/check_modular_layout.py
          python3 tools/check_modular_transport.py
      - name: Render actual modular ImGui fixtures
        run: |
          python3 tools/check_modular_imgui.py --font assets/fonts/BarlowSemiCondensed-Regular.ttf --render-dir modular-fixtures
      - name: Exercise modular renderer through Vulkan
        run: python3 tools/test_modular_vulkan.py
      - uses: actions/upload-artifact@v4
        with:
          name: modular-render-fixtures
          path: modular-fixtures/
      - name: Package isolated experimental Decky ZIP
        run: |
          mkdir -p artifact/ClawMetrics
          cp plugin.json package.json main.py sensors.py diagnostics.py claw_modular.py README.md artifact/ClawMetrics/
          mkdir -p artifact/ClawMetrics/py_modules
          cp updates.py artifact/ClawMetrics/py_modules/updates.py
          cp diagnostics.py artifact/ClawMetrics/py_modules/diagnostics.py
          cp claw_modular.py artifact/ClawMetrics/py_modules/claw_modular.py
          cp -r dist assets native64 artifact/ClawMetrics/
          python3 - <<'PY'
          import pathlib, json, zipfile, sys
          root=pathlib.Path('artifact')
          archive=pathlib.Path('ClawMetrics-v0.2.4-test.108.zip')
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as out:
              for f in sorted(root.rglob('*')):
                  if f.is_file():
                      out.write(f, str(f.relative_to(root)))
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              for p in ['claw_modular.py','py_modules/claw_modular.py','assets/modular/two-rows.json','assets/modular/graph-focus.json','assets/modular/horizontal.json','assets/modular/vertical.json','main.py','diagnostics.py','py_modules/diagnostics.py','py_modules/updates.py','plugin.json','dist/index.js','native64/libMangoHud.so','native64/libMangoHud_opengl.so','native64/libMangoHud_shim.so',
                        'assets/ClawSans.ttf.gz.b64','assets/FONT-LICENSE.txt',
                        'assets/fonts/BarlowSemiCondensed-Light.ttf',
                        'assets/fonts/BarlowSemiCondensed-Regular.ttf',
                        'assets/fonts/BarlowSemiCondensed-SemiBold.ttf',
                        'assets/fonts/BarlowSemiCondensed-Bold.ttf',
                        'assets/fonts/OFL.txt']:
                  assert 'ClawMetrics/'+p in z.namelist(), p
              package=json.loads(z.read('ClawMetrics/package.json'))
              assert package['version'] == '0.2.4-test.108', package['version']
          print(archive,archive.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ClawMetrics-v0.2.4-test.108
          path: ClawMetrics-v0.2.4-test.108.zip
      - name: Publish isolated prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.4-test.108 ClawMetrics-v0.2.4-test.108.zip \
            --target "$GITHUB_SHA" --prerelease \
            --title "Claw Metrics v0.2.4-test.108 – Preview and native padding parity" \
            --notes "Experimental test.108: Fixes the preview font measurement mismatch that made padded RAM/VRAM cards align in the editor but overshoot CPU/GPU cards in game. Preview glyphs now use ImGui/STB ascent-minus-descent sizing instead of the CSS em square, with kerning/ligatures disabled to match the renderer. Tight FPS SVG bounds use the same scale. Both renderers reserve eight/zero digit references to keep clock/memory boxes stable as readings change. Preview reading boxes use the same reference/live maximum and eliminate inherited inline line-height struts. Explicit padding and gaps remain pixel values. Adds a mandatory real Chrome/ImGui comparison of every node rectangle across 24 padded CPU/GPU/RAM/VRAM fixtures, four weights, three font sizes, nested scales and both unit modes. Existing styles keep their stored values; layouts tuned to the old inaccurate preview may need one padding adjustment in the corrected editor. Retains test.107 controller navigation, prior font/outline controls and diagnostics. Full frontend/backend, native Vulkan/OpenGL, ImGui and ZIP checks remain enabled. Actual handheld appearance/controller focus and QAM stability still require device confirmation."
