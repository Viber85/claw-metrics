name: Claw Metrics WIP validation (no release)
on:
  push:
    branches: [feature/gamepad-keyboard-test.16]
  workflow_dispatch:

permissions:
  contents: read

# Cancel previous auto-release workflow on this branch. No ZIP is published.
concurrency:
  group: claw-metrics-v0.2.4-test.16
  cancel-in-progress: true

jobs:
  ui-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Python regressions
        run: python3 -m unittest discover -s tests -v
      - name: Install UI dependencies
        run: npm ci
      - name: Check Decky TypeScript
        run: npm run typecheck
      - name: Build UI only (no ZIP, no release)
        run: npm run build
