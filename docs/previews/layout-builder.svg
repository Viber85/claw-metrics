<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Claw Metrics layout builder illustration</title>
  <desc id="desc">Code-based illustration of the full-screen editor: live preview, zoom slider, collapsible element tree, selected element controls, appearance and position cards, and Apply layout and Cancel buttons.</desc>
  <defs>
    <linearGradient id="stage" x2=".85" y2="1"><stop stop-color="#587687"/><stop offset="1" stop-color="#172c38"/></linearGradient>
    <linearGradient id="hud" x2="0" y2="1"><stop stop-color="#17293e"/><stop offset="1" stop-color="#101825"/></linearGradient>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#e9eef5} .muted{fill:#9eafc5}.tiny{font-size:13px}.small{font-size:16px}.body{font-size:19px}.heading{font-size:21px;font-weight:bold}.label{font-size:17px;font-weight:bold}.accent{fill:#22d4ed}.value{fill:#39e4bc}.surface{fill:#121922;stroke:#2b3544;stroke-width:2}.card{fill:#151d27;stroke:#3b5678;stroke-width:2}.bar{fill:#1b2c43}.field{fill:#253e5b}.button{fill:#547fa5}.thin{stroke:#3b5678;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="680" fill="#0b1119"/>
  <rect x="12" y="12" width="1176" height="154" rx="11" class="surface"/>
  <rect x="23" y="23" width="963" height="132" rx="8" fill="url(#stage)" stroke="#456078" stroke-width="2"/>
  <rect x="34" y="33" width="792" height="103" rx="10" fill="url(#hud)" stroke="#41617d"/>
  <text x="48" y="70" class="small" fill="#28e1bf">FPS</text><text x="48" y="108" font-size="35" font-weight="bold" class="value">84</text>
  <text x="130" y="59" class="small accent">CPU</text><text x="130" y="88" class="small">36%  ·  54°C</text><text x="130" y="116" class="tiny">3500 MHz</text>
  <text x="320" y="59" class="small" fill="#5ddf8d">GPU</text><text x="320" y="88" class="small">72%  ·  52°C</text><text x="320" y="116" class="tiny">1750 MHz</text>
  <text x="510" y="59" class="small" fill="#b875cf">RAM</text><text x="510" y="91" class="small">12.6 GiB</text>
  <text x="650" y="59" class="small" fill="#b875cf">VRAM</text><text x="650" y="91" class="small">7.4 GiB</text>
  <path d="M52 130 Q95 118 138 128 T224 125 T310 129 T396 122 T482 127 T568 124 T654 128 T730 122 T809 126" fill="none" stroke="#38dbb3" stroke-width="3"/>
  <rect x="1000" y="24" width="175" height="70" rx="8" fill="#152436" stroke="#3c526a"/>
  <text x="1014" y="48" class="tiny">Zoom (%)</text><text x="1148" y="48" class="tiny">90</text>
  <path d="M1015 73h143" stroke="#607a94" stroke-width="5" stroke-linecap="round"/><path d="M1015 73h116" stroke="#15c9e7" stroke-width="5" stroke-linecap="round"/><circle cx="1131" cy="73" r="10" fill="#e9eef5"/>
  <rect x="12" y="176" width="1176" height="492" rx="11" class="surface"/>
  <text x="28" y="209" class="heading">Layout controls</text>
  <rect x="1030" y="188" width="67" height="29" rx="14" class="button"/><text x="1042" y="208" class="tiny">Undo</text><text x="1110" y="208" class="tiny muted">Redo</text>
  <rect x="26" y="226" width="394" height="427" rx="9" class="card"/>
  <rect x="26" y="226" width="394" height="49" rx="9" class="bar"/><text x="42" y="255" class="label">☷  Elements</text><text x="381" y="255" class="small">⌄</text>
  <text x="52" y="303" class="body">⌄  Overlay</text>
  <rect x="60" y="320" width="339" height="39" rx="8" fill="#235381"/><text x="78" y="346" class="body">⌄  FPS</text>
  <text x="87" y="387" class="small">·  Average FPS</text><text x="87" y="423" class="small">·  Frametime</text>
  <text x="66" y="459" class="small">›  CPU</text><text x="66" y="495" class="small">›  GPU</text>
  <text x="52" y="535" class="label">Add an element</text>
  <rect x="41" y="549" width="365" height="40" rx="6" class="field"/><text x="55" y="575" class="small">Reading</text><text x="252" y="575" class="small">Separator ▾</text>
  <rect x="41" y="601" width="173" height="35" rx="8" class="button"/><rect x="226" y="601" width="180" height="35" rx="8" class="button"/>
  <text x="94" y="625" class="small">+ Group</text><text x="263" y="625" class="small">+ Reading</text>
  <rect x="430" y="226" width="744" height="427" rx="9" class="card"/>
  <rect x="439" y="234" width="726" height="254" rx="8" class="card"/>
  <rect x="439" y="234" width="726" height="48" rx="8" class="bar"/><text x="457" y="264" class="label">▣  Selected element</text><text x="657" y="264" class="tiny muted">Group · Overlay</text><text x="1136" y="264" class="small">⌄</text>
  <text x="455" y="310" class="tiny muted">NAME</text><rect x="452" y="320" width="342" height="42" rx="8" class="field"/><text x="467" y="348" class="small">Overlay</text>
  <rect x="806" y="320" width="342" height="42" rx="7" class="field"/><text x="820" y="348" class="small">Visible</text><rect x="1099" y="333" width="38" height="18" rx="9" fill="#14cbe2"/><circle cx="1127" cy="342" r="11" fill="white"/>
  <rect x="452" y="381" width="342" height="68" rx="7" class="field"/><text x="467" y="410" class="small">Direction</text><text x="693" y="432" class="small">Row → ▾</text>
  <rect x="806" y="381" width="342" height="68" rx="7" class="field"/><text x="820" y="410" class="small">Group vertical alignment</text><text x="1075" y="432" class="small">Top ▾</text>
  <rect x="439" y="498" width="726" height="48" rx="8" fill="#121a23" stroke="#3b5678"/><text x="457" y="528" class="label">◉  Appearance</text><text x="640" y="528" class="tiny muted">Scale, spacing, color and background</text><text x="1137" y="528" class="small">›</text>
  <rect x="439" y="552" width="726" height="48" rx="8" fill="#121a23" stroke="#3b5678"/><text x="457" y="582" class="label">⌖  Position on screen</text><text x="716" y="582" class="tiny muted">Anchor and offsets</text><text x="1137" y="582" class="small">›</text>
  <rect x="440" y="607" width="350" height="35" rx="8" class="button"/><rect x="801" y="607" width="364" height="35" rx="8" class="button"/>
  <text x="566" y="631" class="small">Apply layout</text><text x="959" y="631" class="small">Cancel</text>
</svg>
